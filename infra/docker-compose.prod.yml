# Production override. Run from the repo root:
#   docker compose --env-file .env.prod -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
# Differences from the dev stack: MongoDB auth on, no published ports for mongo/rustfs, HTTPS through Caddy.
services:
  mongo:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env.prod}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env.prod}
    ports: !reset []

  rustfs:
    ports: !reset []

  api:
    environment:
      # The password is embedded in a URI: use URL-safe characters only (letters, digits, - _ . ~).
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-under30ss}?authSource=admin
      SESSION_COOKIE_SECURE: "true"

  caddy:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (domain) in .env.prod}
    ports: !override
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
