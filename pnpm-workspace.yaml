packages:
  - apps/*
  - packages/*

allowBuilds:
  argon2: true
  esbuild: true
  mongodb-memory-server: true
  sharp: true
  electron: true
  # The Windows portable target does not use the Squirrel installer.
  electron-winstaller: false

minimumReleaseAgeExclude:
  - lucide-react@1.70.0
  - framer-motion@14.10.1
  - motion-dom@14.10.1
  - motion@14.10.1
  - electron@45.3.4
